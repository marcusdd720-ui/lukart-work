name: Stage 12 Trusted Promotion Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  actions: write
  issues: write

jobs:
  control:
    if: startsWith(github.event.comment.body, '/stage12 ')
    runs-on: [self-hosted, Linux, X64, lukart-stage11]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Load trusted control code from default branch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Execute Stage 12 control
        run: python -B -X utf8 scripts/stage12_delivery_control.py
