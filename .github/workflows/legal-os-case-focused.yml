name: LEGAL OS case intake focused
on:
  push:
    branches: [integration/legal-os-hidden-document-engine-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-os-case-focused-branch
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install '.[postgres,ingestion]'
      - name: Check only new LEGAL OS case integration
        run: |
          python -B -X utf8 -m unittest -v \
            tests.test_embedded_document_engine \
            tests.test_legal_os_case_view \
            tests.test_legal_os_case_title \
            tests.test_legal_os_render_listing \
            tests.test_legal_os_http_integration \
            tests.test_legal_os_intake \
            tests.test_legal_os_review \
            tests.test_legal_os_editor \
            tests.test_legal_os_http_editor \
            tests.test_legal_os_case_only_host \
            tests.test_legal_os_cli \
            tests.test_legal_os_windows_launcher

  postgres-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_legal_os_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_legal_os_e2e user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_EGRESS_HOST_PASSWORD: disposable-egress-host-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_legal_os_e2e user=lw_core_runtime password=disposable-runtime-password
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install runtime
        run: python -m pip install '.[postgres,ingestion]'
      - name: Prepare disposable PostgreSQL
        run: python -B -X utf8 scripts/prepare_ci_database.py
      - name: Real PostgreSQL case-only HTTP E2E, synthetic data
        run: |
          test -n "$LUKART_TEST_ADMIN_DSN"
          test -n "$LUKART_TEST_DSN"
          python -B -X utf8 -m unittest -v tests.test_legal_os_postgres_e2e
