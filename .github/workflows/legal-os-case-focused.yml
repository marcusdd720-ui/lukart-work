name: LEGAL OS case intake focused
on:
  push:
    branches: [integration/legal-os-hidden-document-engine-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-os-case-focused-branch
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install '.[postgres,ingestion]'
      - name: Check only new LEGAL OS case integration
        run: |
          python -B -X utf8 -m unittest -v \
            tests.test_embedded_document_engine \
            tests.test_legal_os_case_view \
            tests.test_legal_os_case_title \
            tests.test_legal_os_render_listing \
            tests.test_legal_os_http_integration \
            tests.test_legal_os_intake
