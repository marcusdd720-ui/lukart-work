name: Stage 12 Trusted Procedure Assurance
run-name: stage12-procedure-${{ inputs.dispatch_token || github.sha }}

on:
  push:
    branches:
      - 'codex/stage12-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Stage 12 candidate SHA to validate
        required: true
        type: string
      dispatch_token:
        description: Correlation token for trusted Stage 12 dispatch binding
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage12-assurance:
    name: stage12-assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_stage02_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=lw_core_runtime password=disposable-runtime-password

    steps:
      - name: Resolve exact tested source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            workflow_dispatch)
              sha="${DISPATCH_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid candidate_sha"; exit 1; }
              [[ "${EVENT_SHA}" == "${sha}" ]] || {
                echo "workflow_dispatch ref resolved to ${EVENT_SHA}, expected ${sha}"
                exit 1
              }
              ;;
            pull_request)
              sha="${PR_HEAD_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid pull_request head SHA"; exit 1; }
              ;;
            push)
              sha="${EVENT_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid push SHA"; exit 1; }
              ;;
            *)
              echo "unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "TESTED_SHA=${sha}" >> "${GITHUB_ENV}"
          echo "Resolved exact tested SHA: ${sha}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact tested source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" == "${TESTED_SHA}" ]] || {
            echo "checked out ${actual}, expected ${TESTED_SHA}"
            exit 1
          }
          echo "tested_sha=${actual}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: PostgreSQL 18 backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"

      - name: Install package
        run: python -m pip install '.[postgres,ingestion]' 'jsonschema==4.26.0'

      - name: Export contracts
        run: python -B -X utf8 export_contracts.py

      - name: Prepare CI database
        run: python -B -X utf8 scripts/prepare_ci_database.py

      - name: Focused Stage 09
        run: python -B -X utf8 -m unittest -v tests.test_stage09

      - name: Focused Stage 10 P1 P2 PostgreSQL regressions
        run: |
          python -B -X utf8 -m unittest -v \
            tests.test_stage10.ValidationTests.test_stage10_remediation_expired_uncited_source_blocks \
            tests.test_stage10.ValidationTests.test_stage10_remediation_foreign_uncited_source_blocks \
            tests.test_stage10.ValidationTests.test_stage10_remediation_future_uncited_source_blocks \
            tests.test_stage10.ValidationTests.test_stage10_remediation_current_uncited_source_passes \
            tests.test_stage10.ValidationTests.test_stage10_remediation_source_period_endpoints_and_query_expiry \
            tests.test_stage10.ValidationTests.test_stage10_remediation_distinct_rules_preserve_finding_identity \
            tests.test_stage10.ValidationTests.test_stage10_remediation_unavailable_sources_produce_findings

      - name: Focused Stage 10 adversarial and integration
        run: python -B -X utf8 -m unittest -v tests.test_stage10

      - name: Stage 11 rendering regression
        run: python -B -X utf8 -m unittest -v tests.test_stage11

      - name: Existing Stage 11 delivery-control regression
        run: python -B -X utf8 -m unittest -v tests.test_stage11_delivery_control

      - name: Stage 12 trusted-procedure adversarial regression
        run: python -B -X utf8 -m unittest -v tests.test_stage12_delivery_control

      - name: Full regression
        run: python -B -X utf8 scripts/verify_stage10.py

      - name: Independent JSON Schema validation
        run: python -B -X utf8 scripts/validate_stage10_schemas.py

      - name: Package verification
        run: python -B -X utf8 verify_package.py

      - name: Refresh global integrity manifest
        run: python -B -X utf8 scripts/refresh_manifest.py

      - name: Stage 10 integrity
        run: python -B -X utf8 scripts/check_stage10_integrity.py

      - name: Whitespace check
        run: git diff --check

      - name: Generated evidence is reproducible
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- schemas reports examples tests/golden_cases docs/02-entity-catalog.md)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-procedure-generated
          path: |
            reports/stage10-status.json
            reports/manifest.sha256.json
            reports/stage10-schema-validation.json
            reports/package-validation.json
