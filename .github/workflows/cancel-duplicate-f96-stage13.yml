name: Cancel duplicate f96 Stage13
on:
  push:
    branches: [ops/cancel-duplicate-f96-stage13-2026-10-08]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Free self-hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --method POST "repos/$repo/actions/runs/37742050082/force-cancel" || true
          gh run list --repo "$repo" --branch "ops/cancel-duplicate-f96-stage13-2026-10-08" --limit 20             --json databaseId,status,name             --jq '.[] | select((.status=="queued" or .status=="in_progress") and (.name|test("^stage11-|^stage13-"))) | .databaseId' |
          while read -r id; do
            [[ -n "$id" ]] && gh run cancel "$id" --repo "$repo" || true
          done
