name: Refresh Stage12 generated evidence
on:
  push:
    branches:
      - ops/stage12-generated-evidence-refresh-2026-10-08
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target candidate
        uses: actions/checkout@v4
        with:
          ref: feature/generator-pism-operator-v1-2026-10-07
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install exact schema validator
        run: python -m pip install -e . 'jsonschema==4.26.0'
      - name: Regenerate tracked evidence
        run: |
          set -euo pipefail
          python -B -X utf8 scripts/validate_stage10_schemas.py
          python -B -X utf8 scripts/refresh_manifest.py
          git diff --check
          git status --short
      - name: Commit only expected generated files
        run: |
          set -euo pipefail
          unexpected="$(git status --short | awk '{print $2}' | grep -v -E '^(reports/manifest\.sha256\.json|reports/stage10-schema-validation\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "UNEXPECTED_GENERATED_FILES"
            echo "$unexpected"
            exit 2
          fi
          git add reports/manifest.sha256.json reports/stage10-schema-validation.json
          if git diff --cached --quiet; then
            echo "NO_REFRESH_NEEDED"
            exit 0
          fi
          git config user.name "generator-pism-evidence[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh reproducible Stage12 evidence"
          git push origin HEAD:feature/generator-pism-operator-v1-2026-10-07
