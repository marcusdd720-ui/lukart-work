name: Stage 14 UNIVERSUM execution-kernel assurance
run-name: stage14-${{ inputs.dispatch_token || github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen candidate SHA to validate
        required: true
        type: string
      dispatch_token:
        description: Correlation token for exact-SHA assurance
        required: true
        type: string

permissions:
  contents: read

jobs:
  assurance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, lukart-stage11]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_stage02_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=lw_core_runtime password=disposable-runtime-password
    steps:
      - name: Resolve exact tested source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            workflow_dispatch)
              sha="${DISPATCH_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid candidate_sha"; exit 1; }
              [[ "${EVENT_SHA}" == "${sha}" ]] || { echo "workflow_dispatch SHA mismatch"; exit 1; }
              ;;
            pull_request)
              sha="${PR_HEAD_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid pull_request head SHA"; exit 1; }
              ;;
            push)
              [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "push assurance reserved for main"; exit 1; }
              sha="${EVENT_SHA}"
              ;;
            *) exit 1 ;;
          esac
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "TESTED_SHA=${sha}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Assert exact tested source
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${TESTED_SHA}" ]]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[postgres,ingestion]' 'jsonschema==4.26.0'
      - name: Export contracts
        run: python -B -X utf8 export_contracts.py
      - name: Prepare isolated PostgreSQL
        run: python -B -X utf8 scripts/prepare_ci_database.py
      - name: Targeted Stage 14 verification
        run: python -B -X utf8 -m unittest -v tests.test_stage14
      - name: Full repository regression
        run: python -B -X utf8 scripts/verify_stage14.py
      - name: Independent JSON Schema validation
        run: python -B -X utf8 scripts/validate_stage10_schemas.py
      - name: Package verification
        run: python -B -X utf8 verify_package.py
      - name: Validate Stage 13 replay evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/stage14-stage13-replay.json").read_text())
          assert p["source_stage"]==13
          assert p["observed"]["candidate_sha_count"]==24
          assert p["observed"]["full_ci_run_count_lower_bound"]>=7
          assert p["observed"]["manual_intervention_count"] is None
          print("STAGE14_STAGE13_REPLAY_EVIDENCE: PASS")
          PY
      - name: Refresh global integrity manifest
        run: |
          python -B -X utf8 scripts/refresh_manifest.py
          mkdir -p build/stage14
          cp reports/manifest.sha256.json build/stage14/manifest.sha256.json
          git diff -- reports/manifest.sha256.json > build/stage14/manifest.diff || true
      - name: Whitespace check
        run: git diff --check
      - name: Generated evidence is reproducible
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- schemas reports examples tests/golden_cases docs/02-entity-catalog.md)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage14-assurance-${{ steps.source.outputs.sha }}
          path: build/stage14/
