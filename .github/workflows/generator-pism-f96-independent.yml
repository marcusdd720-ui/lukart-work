name: Generator Pism f96 Independent Verify
on:
  push:
    branches: [ops/generator-pism-f96-independent-verify-2026-10-08]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_stage02_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTED_SHA: f96ce10fce17fc04ff68acb49dac96091164d4f2
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=lw_core_runtime password=disposable-runtime-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f96ce10fce17fc04ff68acb49dac96091164d4f2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[postgres,ingestion]' 'jsonschema==4.26.0'
      - run: python -B -X utf8 scripts/prepare_ci_database.py
      - name: Stage11 exact regression
        run: python -B -X utf8 -m unittest -v tests.test_stage11
      - name: Operator contract
        run: python -B -X utf8 -m unittest -v tests.test_operator
      - name: Production operator E2E
        run: python -B -X utf8 scripts/run_generator_pism_operator_e2e.py --output build/generator-pism/operator-e2e
      - name: Independent verifier
        run: |
          python -B -X utf8 scripts/verify_generator_pism_operator_evidence.py             --evidence build/generator-pism/operator-e2e/evidence.json             --package-dir build/generator-pism/operator-e2e/package             --expected-sha "$TESTED_SHA"             --output build/generator-pism/operator-e2e/verifier.json
      - name: Reproducible generated evidence
        run: |
          python -B -X utf8 scripts/validate_stage10_schemas.py
          python -B -X utf8 scripts/refresh_manifest.py
          git diff --exit-code -- reports/manifest.sha256.json reports/stage10-schema-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-pism-f96-independent-evidence
          path: build/generator-pism/operator-e2e/
