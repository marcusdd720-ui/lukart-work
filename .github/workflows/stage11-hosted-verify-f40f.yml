name: Stage11 hosted verify f40f
on:
  push:
    branches:
      - ops/stage11-hosted-verify-f40f-2026-10-08
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: python -B -X utf8 -m unittest -v tests.test_stage11
