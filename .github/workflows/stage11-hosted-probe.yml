name: Stage11 hosted identity probe
on:
  push:
    branches:
      - ops/stage11-hosted-probe-2026-10-08
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - name: Fresh-process identity probe
        run: python -B -X utf8 -m unittest -v tests.test_stage11.Stage11RenderingTests.test_fresh_process_reproduction_is_stable
