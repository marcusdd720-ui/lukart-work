name: Clear stale runner queue
on:
  push:
    branches:
      - ops/cancel-stale-stage13-2026-10-08
permissions:
  actions: write
  pull-requests: read
jobs:
  clear-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only explicitly whitelisted obsolete PR64 Stage11/12/13 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          current="efbb9006afbddfcbf7e181888845735aa912e44c"
          obsolete="491659d3d786270a61ac6b16b3077871f0ac4070"
          live="$(gh api "repos/$repo/pulls/64" --jq .head.sha)"
          [[ "$live" == "$current" ]] || { echo "ABORT_HEAD_MOVED=$live"; exit 1; }
          echo "PROTECT_EXACT_SHA=$current"
          for id in 37751547265 37752281450 37752278323 37752274895 37751555836 37751555852; do
            record="$(gh api "repos/$repo/actions/runs/$id" --jq '[.head_sha,.status] | @tsv')"
            IFS=$'\t' read -r sha status <<< "$record"
            [[ "$sha" == "$obsolete" ]] || { echo "ABORT_RUN_ID_SHA_MISMATCH=$id $sha"; exit 1; }
            case "$status" in
              queued|waiting|pending)
                echo "CANCEL_OBSOLETE_QUEUED=$id"
                gh run cancel "$id" --repo "$repo"
                ;;
              in_progress)
                echo "FORCE_CANCEL_OBSOLETE_ACTIVE=$id"
                gh api -X POST "repos/$repo/actions/runs/$id/force-cancel"
                ;;
              completed)
                echo "SKIP_ALREADY_COMPLETED=$id"
                ;;
              *)
                echo "UNEXPECTED_STATUS=$id $status"; exit 1;;
            esac
          done
          live="$(gh api "repos/$repo/pulls/64" --jq .head.sha)"
          [[ "$live" == "$current" ]] || { echo "HEAD_MOVED_DURING_CLEANUP=$live"; exit 1; }
          echo "CLEANUP_REQUESTS_COMPLETE_EXACT_SHA_PROTECTED=$current"
