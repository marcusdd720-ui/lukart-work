name: Clear stale runner queue
on:
  push:
    branches:
      - ops/cancel-stale-stage13-2026-10-08
permissions:
  actions: write
jobs:
  clear-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale and duplicate self-hosted runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          keep="37703885345 37703885423 37703890511"
          gh run list --repo "$repo" --limit 100 --json databaseId,status,name,headSha,headBranch,event             --jq '.[] | select((.status=="queued" or .status=="in_progress")) | [.databaseId,.status,.name,.headSha,.headBranch,.event] | @tsv' |
          while IFS=$'\t' read -r id status name sha branch event; do
            [[ -n "$id" ]] || continue
            if grep -qw "$id" <<< "$keep"; then
              echo "KEEP $id $status $name $sha"
              continue
            fi
            case "$name" in
              stage11-*|stage12-*|stage13-*|"Stage 11"*|"Stage 12"*|"Stage 13"*|"Generator Pism"*|"Hermes PR64 Probe")
                echo "CANCEL $id $status $name $sha"
                if [[ "$status" == "in_progress" ]]; then
                  gh api --method POST "repos/$repo/actions/runs/$id/force-cancel" || true
                else
                  gh run cancel "$id" --repo "$repo" || true
                fi
                ;;
            esac
          done