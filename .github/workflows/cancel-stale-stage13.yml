name: Clear stale runner queue
on:
  push:
    branches:
      - ops/cancel-stale-stage13-2026-10-08
permissions:
  actions: write
jobs:
  clear-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep stale self-hosted runs until current candidate starts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          keep=""
          final_sha="491659d3d786270a61ac6b16b3077871f0ac4070"
          for pass in $(seq 1 2); do
            echo "SWEEP_PASS=$pass"
            gh run list --repo "$repo" --limit 100 --json databaseId,status,name,headSha,headBranch,event \
              --jq '.[] | select((.status=="queued" or .status=="in_progress")) | [.databaseId,.status,.name,.headSha,.headBranch,.event] | @tsv' |
            while IFS=$'\t' read -r id status name sha branch event; do
              [[ -n "$id" ]] || continue
              if [[ -n "$keep" ]] && grep -qw "$id" <<< "$keep"; then
                echo "KEEP $id $status $name $sha"
                continue
              fi
              if [[ "$sha" == "$final_sha" ]]; then
                echo "KEEP_FINAL_SHA $id $status $name $sha"
                continue
              fi
              case "$name" in
                stage11-*|stage12-*|stage13-*|"Stage 11"*|"Stage 12"*|"Stage 13"*|"Generator Pism"*|"Hermes PR64 Probe")
                  echo "CANCEL $id $status $name $sha"
                  if [[ "$status" == "in_progress" ]]; then
                    gh api --method POST "repos/$repo/actions/runs/$id/force-cancel" || true
                  else
                    gh run cancel "$id" --repo "$repo" || true
                  fi
                  ;;
              esac
            done
            final_count="$(gh run list --repo "$repo" --limit 100 --json status,headSha --jq '[.[] | select(.headSha=="'"$final_sha"'" and (.status=="queued" or .status=="in_progress"))] | length')"
            echo "FINAL_ACTIVE_COUNT=$final_count"
            [[ "$final_count" -gt 0 ]] && exit 0
            sleep 5
          done
          echo "TARGET_DID_NOT_START_WITHIN_SWEEP_WINDOW"
          exit 1