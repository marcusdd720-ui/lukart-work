name: Generator Pism GO-LIVE E2E
run-name: generator-pism-go-live-${{ github.sha }}
on:
  push:
    branches: [feature/generator-pism-operator-v1-2026-10-07]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: generator-pism-go-live-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  operator-e2e:
    runs-on: [self-hosted, Linux, X64, lukart-stage11]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_stage02_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=lw_core_runtime password=disposable-runtime-password
    steps:
      - name: Resolve exact source
        id: source
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) sha="$PR_SHA" ;;
            workflow_dispatch) sha="$DISPATCH_SHA" ;;
            push) sha="$EVENT_SHA" ;;
            *) exit 2 ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "TESTED_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install
        run: python -m pip install '.[postgres,ingestion]' 'jsonschema==4.26.0'
      - name: Prepare isolated PostgreSQL
        run: python -B -X utf8 scripts/prepare_ci_database.py
      - name: Operator unit contract
        run: python -B -X utf8 -m unittest -v tests.test_operator
      - name: Production-facade public E2E
        run: python -B -X utf8 scripts/run_generator_pism_operator_e2e.py --output build/generator-pism/operator-e2e
      - name: Independent technical verifier
        run: |
          python -B -X utf8 scripts/verify_generator_pism_operator_evidence.py \
            --evidence build/generator-pism/operator-e2e/evidence.json \
            --package-dir build/generator-pism/operator-e2e/package \
            --expected-sha "$TESTED_SHA" \
            --output build/generator-pism/operator-e2e/verifier.json
      - name: Evidence summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path("build/generator-pism/operator-e2e/evidence.json").read_text())
          v=json.loads(Path("build/generator-pism/operator-e2e/verifier.json").read_text())
          assert e["tested_sha"] == os.environ["TESTED_SHA"]
          assert v["tested_sha"] == os.environ["TESTED_SHA"]
          assert e["result"] == v["result"] == "PASS"
          assert e["release_eligibility"] == "FINAL"
          assert e["package_member_count"] == 10
          print("GENERATOR_PISM_GO_LIVE_E2E: PASS")
          PY
      - name: Whitespace check
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-pism-go-live-${{ steps.source.outputs.sha }}
          path: build/generator-pism/operator-e2e/