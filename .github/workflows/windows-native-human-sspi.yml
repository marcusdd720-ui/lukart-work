name: Windows Native HUMAN SSPI
on:
  pull_request:
    paths:
      - "native_windows/*.py"
      - "examples/run_windows_human_operator.py"
      - "examples/human_case_operator_host.py"
      - "tests/test_windows_identity.py"
      - "tests/test_windows_native_auth_integration.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-native-human-sspi.yml"
permissions:
  contents: read
jobs:
  windows-sspi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Resolve exact source
        id: source
        shell: pwsh
        run: |
          $sha = '${{ github.event.pull_request.head.sha }}'
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'INVALID_CANDIDATE_SHA' }
          "TESTED_SHA=$sha" >> $env:GITHUB_ENV
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Assert exact candidate
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TESTED_SHA) { throw "CHECKOUT_SHA_MISMATCH: $actual" }
      - name: Install pinned Windows authentication extra
        run: python -m pip install -e ".[windows-auth,postgres,ingestion]"
      - name: Windows SSPI integration
        run: python -B -X utf8 -m unittest -v tests.test_windows_identity tests.test_windows_native_auth_integration
