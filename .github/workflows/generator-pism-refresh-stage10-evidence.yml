name: Generator Pism refresh Stage10 evidence
on:
  push:
    branches:
      - ops/generator-pism-refresh-stage10-evidence-2026-10-08
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_stage02_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=lw_core_runtime password=disposable-runtime-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generator-pism-operator-v1-2026-10-07
          fetch-depth: 0
          persist-credentials: true
      - name: Assert expected head
        run: test "$(git rev-parse HEAD)" = "f96ce10fce17fc04ff68acb49dac96091164d4f2"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[postgres,ingestion]' 'jsonschema==4.26.0'
      - run: python -B -X utf8 scripts/prepare_ci_database.py
      - name: Regenerate Stage10 canonical test evidence
        run: python -B -X utf8 scripts/verify_stage10.py
      - name: Refresh global manifest after evidence update
        run: python -B -X utf8 scripts/refresh_manifest.py
      - name: Verify integrity
        run: python -B -X utf8 scripts/check_stage10_integrity.py
      - name: Validate exact evidence diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "reports/manifest.sha256.json"
          test "${files[1]}" = "reports/stage10-status.json"
      - name: Commit canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "generator-pism-evidence[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/stage10-status.json reports/manifest.sha256.json
          git commit -m "test: refresh Stage10 evidence for Generator Pism closure"
          git push origin HEAD:feature/generator-pism-operator-v1-2026-10-07
          echo "NEW_SHA=$(git rev-parse HEAD)"
