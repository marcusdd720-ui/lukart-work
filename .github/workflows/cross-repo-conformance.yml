name: Cross-Repo Contract Conformance

on:
  push:
    paths:
      - 'contracts/cross_repo/**'
      - 'lukart_work/convergence/**'
      - 'tests/test_cross_repo_conformance.py'
      - 'scripts/check_cross_repo_contract.py'
      - 'scripts/render_cross_repo_contract.py'
      - 'docs/CROSS_REPO_CONTRACT_CONVERGENCE.md'
      - '.github/workflows/cross-repo-conformance.yml'
  pull_request:
    paths:
      - 'contracts/cross_repo/**'
      - 'lukart_work/convergence/**'
      - 'tests/test_cross_repo_conformance.py'
      - 'scripts/check_cross_repo_contract.py'
      - 'scripts/render_cross_repo_contract.py'
      - 'docs/CROSS_REPO_CONTRACT_CONVERGENCE.md'
      - '.github/workflows/cross-repo-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'pydantic==2.13.5' 'jsonschema==4.26.0'
      - run: python -B -X utf8 scripts/check_cross_repo_contract.py
      - run: python -B -X utf8 -m unittest -v tests.test_cross_repo_conformance
      - run: python -B -X utf8 scripts/render_cross_repo_contract.py --check
      - run: git diff --check
