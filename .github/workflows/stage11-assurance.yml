name: Stage 11 Rendering Assurance

on:
  push:
    branches:
      - main
      - 'codex/stage11-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  stage11-rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install package
        run: python -m pip install -e .
      - name: Delivery-control guard tests
        run: python -B -X utf8 -m unittest -v tests.test_stage11_delivery_control
      - name: Require Stage 11 rendering tests on Stage 11 candidates
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${branch}" == codex/stage11-* ]]; then
            test -f tests/test_stage11.py
            python -B -X utf8 -m unittest -v tests.test_stage11
          fi
      - name: Whitespace check
        run: git diff --check
