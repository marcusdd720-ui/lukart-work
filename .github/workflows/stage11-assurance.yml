name: Stage 11 Rendering Assurance
run-name: stage11-dispatch-${{ inputs.dispatch_token || github.sha }}

on:
  push:
    branches:
      - main
      - 'codex/stage11-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA to validate
        required: true
        type: string
      dispatch_token:
        description: Correlation token for trusted Stage 11 dispatch binding
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage11-rendering:
    name: stage11-rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_stage02_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=lw_core_runtime password=disposable-runtime-password
    steps:
      - name: Resolve exact tested source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            workflow_dispatch)
              sha="${DISPATCH_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid candidate_sha"; exit 1; }
              [[ "${EVENT_SHA}" == "${sha}" ]] || {
                echo "workflow_dispatch ref resolved to ${EVENT_SHA}, expected ${sha}"
                exit 1
              }
              ;;
            pull_request)
              sha="${PR_HEAD_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid pull_request head SHA"; exit 1; }
              ;;
            push)
              sha="${EVENT_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid push SHA"; exit 1; }
              ;;
            *)
              echo "unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "TESTED_SHA=${sha}" >> "${GITHUB_ENV}"
          echo "Resolved exact tested SHA: ${sha}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact tested source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" == "${TESTED_SHA}" ]] || {
            echo "checked out ${actual}, expected ${TESTED_SHA}"
            exit 1
          }
          echo "tested_sha=${actual}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: Install package
        run: python -m pip install -e '.[postgres,ingestion,rendering]'

      - name: Prepare disposable PostgreSQL
        run: python -B -X utf8 scripts/prepare_ci_database.py

      - name: Delivery-control guard tests
        run: python -B -X utf8 -m unittest -v tests.test_stage11_delivery_control

      - name: Export contracts
        run: python -B -X utf8 export_contracts.py

      - name: Stage 11 rendering tests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python -B -X utf8 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from scripts.stage11_delivery_control import (
              PROCEDURE_BOOTSTRAP_BASE, PROCEDURE_BOOTSTRAP_BRANCH, require_stage11_tests,
          )

          branch = os.environ.get("PR_HEAD_REF") or os.environ["REF_NAME"]
          present = Path("tests/test_stage11.py").is_file()
          paths = []
          if not present and branch == PROCEDURE_BOOTSTRAP_BRANCH:
              subprocess.run(["git", "merge-base", "--is-ancestor", PROCEDURE_BOOTSTRAP_BASE, "HEAD"], check=True)
              paths = subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "-z", PROCEDURE_BOOTSTRAP_BASE, "HEAD"],
                  text=True,
              ).split("\0")[:-1]
          mode = require_stage11_tests(branch, present, base_sha=PROCEDURE_BOOTSTRAP_BASE, changed_paths=paths)
          print(f"stage11_assurance_mode={mode}", flush=True)
          if mode == "RENDERING_TESTS_REQUIRED":
              subprocess.run(
                  ["python", "-B", "-X", "utf8", "scripts/verify_stage11.py"],
                  check=True,
              )
          PY

      - name: Independent JSON Schema validation
        run: python -B -X utf8 scripts/validate_stage11_schemas.py

      - name: Package verification
        run: python -B -X utf8 verify_package.py

      - name: Refresh global integrity manifest
        run: python -B -X utf8 scripts/refresh_manifest.py

      - name: Stage 11 integrity
        run: python -B -X utf8 scripts/check_stage11_integrity.py

      - name: Whitespace check
        run: git diff --check

      - name: Generated evidence is reproducible
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- schemas reports examples tests/golden_cases docs/02-entity-catalog.md)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage11-generated
          path: |
            schemas/Render*.schema.json
            schemas/Rendering*.schema.json
            reports/stage11-status.json
            reports/stage11-schema-validation.json
            reports/package-validation.json
            reports/manifest.sha256.json
