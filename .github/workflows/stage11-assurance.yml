name: Stage 11 Rendering Assurance
run-name: stage11-dispatch-${{ inputs.dispatch_token || github.sha }}

on:
  push:
    branches:
      - main
      - 'codex/stage11-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA to validate
        required: true
        type: string
      dispatch_token:
        description: Correlation token for trusted Stage 11 dispatch binding
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage11-rendering:
    name: stage11-rendering
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Resolve exact tested source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            workflow_dispatch)
              sha="${DISPATCH_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid candidate_sha"; exit 1; }
              [[ "${EVENT_SHA}" == "${sha}" ]] || {
                echo "workflow_dispatch ref resolved to ${EVENT_SHA}, expected ${sha}"
                exit 1
              }
              ;;
            pull_request)
              sha="${PR_HEAD_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid pull_request head SHA"; exit 1; }
              ;;
            push)
              sha="${EVENT_SHA}"
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid push SHA"; exit 1; }
              ;;
            *)
              echo "unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "TESTED_SHA=${sha}" >> "${GITHUB_ENV}"
          echo "Resolved exact tested SHA: ${sha}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact tested source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" == "${TESTED_SHA}" ]] || {
            echo "checked out ${actual}, expected ${TESTED_SHA}"
            exit 1
          }
          echo "tested_sha=${actual}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: Install package
        run: python -m pip install -e .

      - name: Self-hosted ingestion isolation diagnostic
        shell: bash
        run: |
          python -B -X utf8 - <<'PY'
          import os
          import resource
          import sys
          from pathlib import Path
          print("python=", sys.version)
          print("platform=", sys.platform)
          print("rlimit_as_before=", resource.getrlimit(resource.RLIMIT_AS))
          status = Path("/proc/self/status").read_text()
          for line in status.splitlines():
              if line.startswith(("VmSize:", "VmRSS:")):
                  print(line)
          resource.setrlimit(resource.RLIMIT_AS, (512 * 1024 * 1024, 512 * 1024 * 1024))
          print("rlimit_as_after=", resource.getrlimit(resource.RLIMIT_AS))
          from lukart_work.ingestion.extract import extract
          result = extract(b"synthetic text", "text/plain")
          print("direct_extract_status=", result.status)
          from lukart_work.ingestion.service import parse_isolated
          isolated = parse_isolated(b"synthetic text", "text/plain")
          print("isolated_extract_status=", isolated.status)
          print("isolated_warnings=", isolated.warnings)
          PY

      - name: Delivery-control guard tests
        run: python -B -X utf8 -m unittest -v tests.test_stage11_delivery_control

      - name: Stage 11 rendering tests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python -B -X utf8 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import unittest
          from scripts.stage11_delivery_control import (
              PROCEDURE_BOOTSTRAP_BASE, PROCEDURE_BOOTSTRAP_BRANCH, require_stage11_tests,
          )

          branch = os.environ.get("PR_HEAD_REF") or os.environ["REF_NAME"]
          present = Path("tests/test_stage11.py").is_file()
          paths = []
          if not present and branch == PROCEDURE_BOOTSTRAP_BRANCH:
              subprocess.run(["git", "merge-base", "--is-ancestor", PROCEDURE_BOOTSTRAP_BASE, "HEAD"], check=True)
              paths = subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "-z", PROCEDURE_BOOTSTRAP_BASE, "HEAD"],
                  text=True,
              ).split("\0")[:-1]
          mode = require_stage11_tests(branch, present, base_sha=PROCEDURE_BOOTSTRAP_BASE, changed_paths=paths)
          print(f"stage11_assurance_mode={mode}", flush=True)
          if mode == "RENDERING_TESTS_REQUIRED":
              suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_stage11")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or result.skipped or not result.testsRun:
                  raise SystemExit("Stage 11 rendering evidence incomplete or failed")
          PY

      - name: Whitespace check
        run: git diff --check
