name: Generator Pism Hosted E2E c90d
on:
  push:
    branches: [ops/generator-pism-hosted-e2e-c90d-2026-10-08]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lukart_stage02_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUKART_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=postgres password=disposable-ci-password
      LUKART_TEST_RUNTIME_PASSWORD: disposable-runtime-password
      LUKART_TEST_DSN: host=127.0.0.1 port=5432 dbname=lukart_stage02_test user=lw_core_runtime password=disposable-runtime-password
      TESTED_SHA: c90d6e173ab14e508973ca52978734d1e6254e7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[postgres,ingestion]' 'jsonschema==4.26.0'
      - run: python -B -X utf8 scripts/prepare_ci_database.py
      - run: python -B -X utf8 -m unittest -v tests.test_operator
      - run: python -B -X utf8 scripts/run_generator_pism_operator_e2e.py --output build/generator-pism/operator-e2e
      - run: |
          python -B -X utf8 scripts/verify_generator_pism_operator_evidence.py \
            --evidence build/generator-pism/operator-e2e/evidence.json \
            --package-dir build/generator-pism/operator-e2e/package \
            --expected-sha "$TESTED_SHA" \
            --output build/generator-pism/operator-e2e/verifier.json
