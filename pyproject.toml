[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lukart-work-domain-contracts"
version = "0.11.0"
description = "Architecture 00 Case Core with controlled drafting, validation and deterministic rendering"
requires-python = ">=3.11"
dependencies = [
  "packaging==25.0",
  "pydantic==2.13.5",
  "python-docx==1.2.0",
  "reportlab==4.4.9",
  "fontpkg==0.2.2",
  "fontpkg-lato==2.15",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.3"]
ingestion = ["pypdf==6.10.0", "Pillow==12.3.0"]

[tool.setuptools.packages.find]
include = ["lukart_work*"]

[tool.setuptools.package-data]
"lukart_work" = ["operator_preview.js", "operator_intake.js"]
"lukart_work.core" = ["migration.sql", "migration_ai_egress.sql"]
"lukart_work.storage" = ["migration.sql"]
