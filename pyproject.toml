[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lukart-work-domain-contracts"
version = "0.7.0"
description = "Architecture 00 Case Core with auditable Procedural Intelligence Engine"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.3"]
ingestion = ["pypdf==6.10.0"]

[tool.setuptools.packages.find]
include = ["lukart_work*"]

[tool.setuptools.package-data]
"lukart_work.core" = ["migration.sql"]
"lukart_work.storage" = ["migration.sql"]
